{% extends "base.html" %}
{% block title %}Add Event — Campus Event Registration{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Add Event</h1>
  <p class="page-subtitle">Create a new campus event</p>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('add_event') }}" novalidate>

    <div class="form-group">
      <label for="event_id">Event ID <span class="required">*</span></label>
      <input type="text" id="event_id" name="event_id"
             placeholder="e.g. E101"
             maxlength="20"
             required />
      <small class="form-hint">A unique identifier for the event (e.g. E101, CS2025).</small>
    </div>

    <div class="form-group">
      <label for="event_name">Event Name <span class="required">*</span></label>
      <input type="text" id="event_name" name="event_name"
             placeholder="e.g. Cybersecurity Workshop"
             maxlength="100"
             required />
    </div>

    <div class="form-group">
      <label for="capacity">Capacity <span class="required">*</span></label>
      <input type="number" id="capacity" name="capacity"
             placeholder="e.g. 50"
             min="1"
             required />
      <small class="form-hint">Must be a positive integer.</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Add Event</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
